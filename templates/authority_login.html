{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:560px;margin:auto">
<div class="kicker">ROOM AUTHORITY</div><h2>Authority Login</h2>
<p class="muted">Only the Higher Authority account that owns a room can use this login.</p>
<form method="post">
<label>Authority Email or Mobile</label><input name="identifier" required>
<label>Password</label><input name="password" type="password" required>
<button>Continue to Authority OTP</button>
</form>
<p class="muted" style="margin-top:1rem"><a href="{{url_for('authority_register')}}">Create Authority Account & First Room</a> · <a href="{{url_for('login')}}">Member Login</a></p>
</div>{% endblock %}
