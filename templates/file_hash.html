{% extends "base.html" %}{% block content %}<div class="page-grid"><div class="card"><h2>Select evidence file</h2>
<form method="post" enctype="multipart/form-data"><label>File</label><input type="file" name="file" required><button>Hash File</button></form></div>
{% if result %}<div class="card"><h2>File Information</h2><table>{% for k,v in result.info.items() if k != 'absolute_path' %}<tr><th>{{k}}</th><td>{{v}}</td></tr>{% endfor %}</table></div>
<div class="card full"><h2>Cryptographic Hashes</h2><table>{% for k,v in result.hashes.items() %}<tr><th>{{k}}</th><td class="mono hash">{{v}}</td></tr>{% endfor %}</table></div>{% endif %}</div>{% endblock %}
