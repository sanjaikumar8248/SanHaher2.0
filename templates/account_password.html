{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:520px;margin:auto"><div class="kicker">Account Security</div><h2>Change Login Password</h2>
<form method="post"><label>Current Password</label><input type="password" name="current_password" required>
<label>New Password</label><input type="password" name="new_password" required minlength="8">
<label>Confirm New Password</label><input type="password" name="confirm_password" required minlength="8">
<button>Update Password</button></form>
</div>{% endblock %}
