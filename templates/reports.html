{% extends "base.html" %}{% block content %}<div class="page-grid"><div class="card"><h2>Generate Report</h2>
<form method="post"><label>Case</label><select name="case_id" required>{% for c in nav_cases %}<option>{{c.case_id}}</option>{% endfor %}</select>
<button>Generate Forensic Report</button></form></div><div class="card"><h2>Generated Reports</h2>{% if reports %}<table><tr><th>Report</th><th>Action</th></tr>
{% for r in reports %}<tr><td>{{r.name}}</td><td><a class="button secondary" href="{{url_for('download_report',name=r.name)}}">Open / Download</a></td></tr>{% endfor %}</table>{% else %}<p>No reports yet.</p>{% endif %}</div></div>{% endblock %}
